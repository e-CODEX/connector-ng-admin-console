name: Manual Release Workflow

on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to deploy to'
                required: true
                default: 'production'
                type: choice
                options:
                    - production
jobs:
    check-version:
        name: Check the current release version
        uses: e-CODEX/workflows/.github/workflows/npm-validate-release-version.yaml@51e5e37345807abb3be06b032dd77b4b02077b53
        with:
            node-version: "22"
    tag-version:
        name: Tag the current release version
        needs: check-version
        uses: e-CODEX/workflows/.github/workflows/npm-tag-release-version.yaml@51e5e37345807abb3be06b032dd77b4b02077b53
        with:
            node-version: "22"
            environment: ${{ inputs.environment }}
    docs:
        name: Generate the documentation PDFs
        needs: tag-version
        uses: e-CODEX/workflows/.github/workflows/asciidoc-pdf-release.yaml@7c00ff420cc3fc7e60fd326fe8450c6c4d342aea
        with:
            adoc-files: |
                docs/installation-guide.adoc
                docs/changelog.adoc
            tag: ${{ needs.tag-version.outputs.tag }}
    publish:
        name: Publish the current release version
        needs: [tag-version, docs]
        uses: e-CODEX/workflows/.github/workflows/npm-publish-nextjs-release.yaml@e11c8f8c4b46fb8c75458c915f818d6b8e8bcfb9
        with:
            node-version: "22"
            app-folder: "connector-ng-admin-console"
            tag: ${{ needs.tag-version.outputs.tag }}
            environment: ${{ inputs.environment }}
            docs-artifact-name: ${{ needs.docs.outputs.artifact-name }}

    docker:
        name: Build and push the docker image
        needs: tag-version
        uses: e-CODEX/workflows/.github/workflows/docker-build-push.yaml@main
        with:
            image-name: connector-ng-admin-console
            tag: ${{ needs.tag-version.outputs.tag }}
            environment: ${{ inputs.environment }}
